services:
  - type: web
    name: codeargus-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://codeargus.netlify.app
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: SESSION_REVIEW_LIMIT
        value: "10"
      - key: SESSION_GEMINI_LIMIT
        value: "10"
      - key: SESSION_TOKEN_LIMIT
        value: "150000"
      - key: REVIEW_PROMPT_TOKEN_LIMIT
        value: "8000"
      - key: REVIEW_OUTPUT_TOKEN_LIMIT
        value: "4500"
